# Site settings
title: Artemis Veizi
author: Artemis Veizi
email: aveizi@stanford.edu
description: >-
  Artemis Veizi — M.S. Computer Science (AI) student at Stanford and Silicon
  Validation Engineer at Apple. Research and projects in machine learning,
  AI evaluation, and optimization.
# When you set up the custom domain artemisveizi.io, change url to https://artemisveizi.io
url: "https://artemisveizi.github.io"
baseurl: ""

# Theme
theme: minima
minima:
  skin: classic
# Social links (minima 2.5.x, as pinned by github-pages, reads these top-level keys)
github_username: artemisveizi
linkedin_username: artemisveizi

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  # Generates /sitemap.xml, which is what you submit to Google Search Console.
  # On the GitHub Pages supported-plugins list, so Pages runs it server-side.
  - jekyll-sitemap

# Paste the token from Search Console's "HTML tag" verification method here and
# jekyll-seo-tag will emit the meta tag. Leave commented until you have it —
# an empty value renders an empty tag, which fails verification.
# google_site_verification: "your-token-here"

# Dart Sass (Jekyll 4) warns that @import, lighten()/darken() and slash-division
# are deprecated. Those all come from inside the minima gem's own stylesheets,
# which we don't control. quiet_deps silences dependency warnings only —
# warnings for assets/main.scss still surface.
sass:
  quiet_deps: true
  # minima 2.5 has no @use-compatible entry point — it relies on @import plus
  # global !default variables — so `@import "minima"` cannot be modernised
  # without forking the theme.
  #
  # color-functions/global-builtin cover lighten() in assets/main.scss. That
  # can't be modernised either: GitHub Pages compiles with Ruby Sass 3.7, which
  # has no module system, so color.adjust() is a hard syntax error there.
  #
  # These keys are Dart Sass options; the older converter Pages uses ignores
  # them harmlessly.
  silence_deprecations:
    - import
    - color-functions
    - global-builtin

# Navigation: pages listed in the header, in order
header_pages:
  - research-projects.md
  - cv.md

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  # Node test harnesses — they drive assets/js/pool.js headlessly and have no
  # business being served. Without this Jekyll copies them into _site.
  - test
